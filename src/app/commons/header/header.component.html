<div class="page-wrapper">
    <div *ngIf="loader" class="preloader">
        <div class="gps-loader">
            <span class="gps-ping"></span>
            <span class="gps-ping gps-ping-delay"></span>
            <span class="gps-pin-badge">
                <img src="./assets/img/logo/logo_ubicacion.svg" alt="" width="64" height="64" />
            </span>
        </div>
        <p class="gps-loader-text">Rastreomex</p>
    </div>
</div>
<section id="topbar-2">
    <div class="container">
        <div class="row">
            <div class="col-sm-12 topbar-base-2 no-padding">
                <div class="col-sm-8 col-md-8 col-12 topbar-block left text-left tbleftalign">
                    <ul>
                        <li><a href="tel:+525572414206"><i class="fa fa-phone"></i>+52 55 7241 4206</a> </li>
                        <li><a href="mailto:rastreomex@gmail.com"><i class="fa fa-envelope"></i>rastreomex@gmail.com</a> </li>
                    </ul>
                </div>
                <div class="col-sm-4 col-md-4 col-12 topbar-block text-right tbleftalign">
                </div>
            </div>
        </div>
    </div>
</section>
<header class="site-header">
    <div class="container">
        <div class="site-header-row">
            <a href="#" (click)="scrollTo('home')" class="site-logo" aria-label="Rastreomex - Inicio">
                <img src="./assets/img/logo/logo1.svg" alt="Rastreomex - Rastreo satelital GPS" width="150" height="72" />
            </a>

            <button type="button" class="site-nav-toggle" [class.is-open]="menuOpen" (click)="toggleMenu()"
                [attr.aria-expanded]="menuOpen" aria-controls="site-nav" aria-label="Abrir menú de navegación">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav class="site-nav" id="site-nav" [class.is-open]="menuOpen">
                <ul class="site-nav-links">
                    <li><a (click)="scrollTo('home')">Inicio</a></li>
                    <li><a (click)="scrollTo('aboutus')">Sobre nosotros</a></li>
                    <li><a (click)="scrollTo('servicios')">Servicios</a></li>
                    <li><a (click)="scrollTo('prices')">Precios</a></li>
                    <li><a (click)="scrollTo('faq')">Preguntas frecuentes</a></li>
                    <li><a (click)="scrollTo('contactus')">Contáctanos</a></li>
                </ul>
                <a class="site-nav-cta" (click)="scrollTo('prices')">Ver Planes</a>
            </nav>
        </div>
    </div>
</header>
