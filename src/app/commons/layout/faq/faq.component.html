<section id="faq" class="services-section section-divide">
    <div class="container">
        <div class="row">
            <div class="col-sm-12 col-md-12 col-lg-12 col-xl-12">
                <div class="section-title-s1 text-center">
                    <span>Ayuda</span>
                    <h2>Preguntas frecuentes sobre rastreo GPS</h2>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-10 offset-lg-1 col-md-12">
                <div class="accordion" id="faqAccordion">
                    <div class="accordion-item" *ngFor="let item of faqs; let i = index">
                        <h3 class="accordion-header" [attr.id]="'faq-heading-' + i">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                                [attr.data-bs-target]="'#faq-collapse-' + i" aria-expanded="false"
                                [attr.aria-controls]="'faq-collapse-' + i">
                                {{ item.question }}
                            </button>
                        </h3>
                        <div [attr.id]="'faq-collapse-' + i" class="accordion-collapse collapse"
                            [attr.aria-labelledby]="'faq-heading-' + i" data-bs-parent="#faqAccordion">
                            <div class="accordion-body">
                                {{ item.answer }}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
